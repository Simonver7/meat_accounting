<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Учёт мяса — Отчёты</title>

    <link rel="icon" type="image/png" sizes="192x192" href="/static/public/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/public/icon-512.png">
    <link rel="apple-touch-icon" href="/static/public/icon-192.png">

    <link
        rel="stylesheet"
        href="/static/css/reports.css?v=desktop-layout"
    >

    <script
        src="/static/js/reports.js"
        defer
    ></script>
</head>

<body>

<div class="reports-page">

    <!-- =========================
         HEADER
    ========================== -->

    <header class="reports-header">

        <div class="header-left">

            <button
                class="back-button"
                id="back-button"
                type="button"
                aria-label="Назад"
            >
                ←
            </button>

            <div>
                <h1>Отчёты</h1>

                <p id="report-date">
                    Сегодня
                </p>
            </div>

        </div>

    </header>


    <!-- =========================
         CONTENT
    ========================== -->

    <main class="reports-content">

        <!-- ERROR -->

        <div
            class="report-error"
            id="report-error"
            hidden
        >
            <div class="error-title">
                Не удалось загрузить отчёт
            </div>

            <div
                class="error-message"
                id="error-message"
            >
                Попробуйте ещё раз.
            </div>

            <button
                class="retry-button"
                id="retry-button"
                type="button"
            >
                Повторить
            </button>
        </div>


        <!-- REPORT -->

        <section
            class="report-card"
            id="report-card"
        >

            <div class="report-title-row">

                <div>
                    <h2>С кожей</h2>

                    <p>
                        Движение мяса за сегодня
                    </p>
                </div>

                <div
                    class="report-status"
                    id="report-status"
                >
                    Загрузка...
                </div>

            </div>


            <!-- START -->

            <div class="report-row">

                <span class="report-label">
                    На начало
                </span>

                <strong
                    class="report-value"
                    id="opening-stock"
                >
                    —
                </strong>

            </div>


            <!-- INCOMING -->

            <div class="report-row">

                <span class="report-label">
                    Приход
                </span>

                <strong
                    class="report-value"
                    id="incoming-value"
                >
                    +0
                </strong>

            </div>


            <!-- SPIT -->

            <div class="report-row">

                <span class="report-label">
                    Вертель
                </span>

                <strong
                    class="report-value expense"
                    id="spit-value"
                >
                    −0
                </strong>

            </div>


            <!-- END -->

            <div class="report-row report-row-total">

                <span class="report-label">
                    На конец
                </span>

                <strong
                    class="report-value total"
                    id="closing-stock"
                >
                    —
                </strong>

            </div>

        </section>


        <!-- =========================
             EXCEL
        ========================== -->

        <button
            class="excel-button"
            id="excel-button"
            type="button"
        >
            <span class="excel-icon">↓</span>

            <span>
                Скачать Excel
            </span>
        </button>


        <!-- =========================
             INFO
        ========================== -->

        <div
            class="last-update"
            id="last-update"
        >
            Обновление данных...
        </div>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->

    <nav class="bottom-navigation">

        <a
            href="/dashboard"
            class="nav-item"
        >
            <span class="nav-icon">⌂</span>

            <span>
                Главная
            </span>
        </a>


        <a
            href="/history"
            class="nav-item"
        >
            <span class="nav-icon">≡</span>

            <span>
                История
            </span>
        </a>


        <a
            href="/reports"
            class="nav-item active"
        >
            <span class="nav-icon">▥</span>

            <span>
                Отчёты
            </span>

            <span class="active-dot"></span>
        </a>

    </nav>


    <!-- =========================
         TOAST
    ========================== -->

    <div
        class="toast"
        id="toast"
        role="status"
    ></div>

</div>

</body>
</html>
