<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#121212">
    <title>Профиль — Учёт мяса</title>
    <link rel="stylesheet" href="/static/css/profile.css?v=desktop-layout">
    <script src="/static/js/profile.js" defer></script>
</head>
<body>
    <main class="profile-page">
        <header class="profile-header">
            <a href="/dashboard" class="back-link">← Главная</a>
            <h1>Профиль</h1>
            <p>Изменение имени, логина и пароля</p>
        </header>

        <form id="profile-form" class="profile-card">
            <label class="field">
                <span>Имя пользователя</span>
                <input id="display-name" name="display_name" type="text" maxlength="100" autocomplete="name" required>
            </label>

            <label class="field">
                <span>Логин</span>
                <input id="username" name="username" type="text" maxlength="50" autocomplete="username" required>
            </label>

            <label class="field">
                <span>Новый пароль <small>(необязательно)</small></span>
                <input id="new-password" name="new_password" type="password" minlength="8" maxlength="100" autocomplete="new-password">
            </label>

            <label class="field">
                <span>Повторите новый пароль</span>
                <input id="confirm-password" name="confirm_password" type="password" minlength="8" maxlength="100" autocomplete="new-password">
            </label>

            <label class="field">
                <span>Текущий пароль для подтверждения</span>
                <input id="current-password" name="current_password" type="password" maxlength="100" autocomplete="current-password" required>
            </label>

            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>

            <button id="save-button" type="submit">Сохранить изменения</button>
        </form>
    </main>
</body>
</html>
