server {
    listen 80;
    server_name meat-uchet.ru www.meat-uchet.ru;

    # Статика фронтенда
    location /static/ {
        alias /home/deploy/meat_accounting/frontend/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API — прокси к FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health checks (для мониторинга/балансировщика)
    location /health/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Всё остальное — фронтенд (HTML файлы)
    location / {
        root /home/deploy/meat_accounting/frontend/public;
        try_files $uri $uri/ /login.html;

        # HTML не кэшируем
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Безопасность заголовков
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header X-XSS-Protection "1; mode=block";
}